name: Build Alexandria APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Os testes dos motores (MOBI, DJVU, CBR) falham em vez de serem pulados se não puderem rodar.
      ORE_REQUIRE_HOST_ENGINES: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # NDK para compilar os motores do OpenReadEra; nasm e zlib para compilá-los também para Linux (testes).
      - name: Install NDK and native test tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
          sudo apt-get update
          sudo apt-get install -y nasm zlib1g-dev
      # Usa o Gradle Wrapper do repositório (versão fixada em gradle/wrapper) e valida o JAR dele.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alexandria-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alexandria-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
