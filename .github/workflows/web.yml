name: Site (GitHub Pages)

# Testa, gera e publica o site a cada atualização da pasta web/, no branch principal ou no de desenvolvimento.
# A publicação vai para o branch gh-pages, que o GitHub Pages serve em https://mooncake-cmd.github.io/Alexandria/.
on:
  workflow_dispatch:
  push:
    branches: [ main, ccr-e603d834-7whfoo ]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish to gh-pages
        working-directory: web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site gerado de ${SOURCE_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
